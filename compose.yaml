# TRS-80 IDE in the browser:  docker compose up  →  http://localhost:3000
# (On macOS 26+ Apple's native runtime works too:
#    container run -p 3000:3000 ghcr.io/techprototyper/trs80-ide:latest )
services:
  trs80-ide:
    image: ghcr.io/techprototyper/trs80-ide:latest
    ports:
      - "3000:3000"
