# Builds the devcontainer image and publishes it to ghcr.io, so Codespaces
# pull a ready image instead of building the Dockerfile on every create.
#
# devcontainer.json references ghcr.io/techprototyper/trs80-dev:latest.
# Iteration loop: edit .devcontainer/Dockerfile → push to main → this workflow
# publishes a fresh :latest → new Codespaces (or a rebuild) pick it up.
name: devcontainer image

on:
  push:
    branches: [main]
    paths:
      - ".devcontainer/**"
      - ".github/workflows/devcontainer-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .devcontainer
          file: .devcontainer/Dockerfile
          push: true
          tags: |
            ghcr.io/techprototyper/trs80-dev:latest
            ghcr.io/techprototyper/trs80-dev:${{ github.sha }}
